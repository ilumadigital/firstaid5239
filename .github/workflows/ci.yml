name: Validate and Publish Firstaid5239
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: firstaid5239-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download verified official ENAK main logo
        run: |
          if [ ! -s public/enak-logo.png ]; then
            curl --fail --location --silent --show-error --retry 2 --max-time 40 \
              "https://enak.gr/wp-content/uploads/2024/03/ENAK.png" \
              --output public/enak-logo.png
          fi
          python3 - <<'PY'
          from pathlib import Path
          logo = Path('public/enak-logo.png').read_bytes()
          assert logo.startswith(b'\\x89PNG\\r\\n\\x1a\\n'.decode('unicode_escape').encode('latin1')) or logo[:8] == bytes((137,80,78,71,13,10,26,10)), 'ENAK official asset must be a PNG image'
          assert len(logo) > 1000, 'ENAK logo was not downloaded correctly'
          print('Official ENAK logo verified:',len(logo),'bytes')
          PY

      - name: Build static HTML and test site + email handler
        run: npm run check

      - name: Check live domain DNS and HTTP status (informational)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          echo '==== DNS A ===='
          getent ahostsv4 firstaid5239.gr | head -6 || true
          echo '==== HTTPS HEAD ===='
          curl -sSL -I --connect-timeout 10 --max-time 20 https://firstaid5239.gr/ | head -35 || true
          echo '==== WWW HTTPS HEAD ===='
          curl -sSL -I --connect-timeout 10 --max-time 20 https://www.firstaid5239.gr/ | head -25 || true

      - name: Publish build to repository root for static hosting
        if: github.event_name == 'push'
        run: |
          cp -R dist/. .
          git add -- index.html styles.css sections.css mobile.css hero-form.css script.js enak-logo.png public/enak-logo.png favicon.svg og-cover.svg hero-art.svg privacy.html robots.txt sitemap.xml llms.txt llms-full.txt faq.md site.webmanifest
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: publish compiled site to web root [skip ci]"
            git push origin HEAD:main
          fi
