name: Validate and Publish Firstaid5239
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build static HTML and test site + email handler
        run: npm run check

      - name: Check live domain DNS and HTTP status (informational)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          echo '==== DNS A ===='
          getent ahostsv4 firstaid5239.gr | head -6 || true
          echo '==== HTTPS HEAD ===='
          curl -sSL -I --connect-timeout 10 --max-time 20 https://firstaid5239.gr/ | head -35 || true
          echo '==== WWW HTTPS HEAD ===='
          curl -sSL -I --connect-timeout 10 --max-time 20 https://www.firstaid5239.gr/ | head -25 || true

      - name: Inspect official ENAK logo URLs (informational)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request,re
          for site in ('https://enak.gr/','https://enak.gr/info/'):
              try:
                  req=urllib.request.Request(site,headers={'User-Agent':'Mozilla/5.0 (compatible; Firstaid5239BrandAudit/1.0)'})
                  html=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','ignore')
                  print('SITE',site,'LEN',len(html))
                  for m in re.finditer(r'<(?:img|link)[^>]+>',html,re.I):
                      tag=m.group(0)
                      if any(t in tag.lower() for t in ('logo','custom-logo','site-logo','favicon','apple-touch-icon')):
                          print('ASSET',tag[:650])
              except Exception as e:print('ENAK AUDIT ERROR',site,type(e).__name__,str(e)[:200])
          PY

      - name: Publish build to repository root for static hosting
        if: github.event_name == 'push'
        run: |
          cp -R dist/. .
          git add -- index.html styles.css sections.css mobile.css script.js favicon.svg og-cover.svg hero-art.svg privacy.html robots.txt sitemap.xml llms.txt llms-full.txt faq.md site.webmanifest
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: publish compiled site to web root [skip ci]"
            git push origin HEAD:main
          fi
